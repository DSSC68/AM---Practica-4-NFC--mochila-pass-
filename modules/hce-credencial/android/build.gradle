// Configuracion de Gradle del modulo nativo (libreria Android que se enlaza a la app)
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.hcecredencial'
version = '1.0.0'

expoModule {
  v2 true
}

android {
  namespace "expo.modules.hcecredencial"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}
